# Host: 203.0.113.10 (both tenants). node-exporter, job="node".
# Thresholds are starting points; tune on real data.
groups:
  - name: host
    rules:
      - alert: HostDiskFilling
        expr: |
          (1 - node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}
             / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}) > 0.80
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Disk / is {{ $value | humanizePercentage }} full"

      - alert: HostDiskAlmostFull
        expr: |
          (1 - node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}
             / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}) > 0.90
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Disk / is {{ $value | humanizePercentage }} full: services will start failing"

      - alert: HostDiskFullIn24h
        # Only with (nearly) 6h of samples: a fresh start plus image pulls
        # would otherwise extrapolate a few minutes of churn to "full".
        expr: |
          predict_linear(node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
          and count_over_time(node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}[6h]) > 1200
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "At the current rate, disk / is full within 24 hours"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of RAM available"

      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill{job="node"}[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "The kernel killed a process for lack of memory (OOM)"

      - alert: HostCpuSaturated
        expr: 1 - avg(rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) > 0.90
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "CPU above 90% for 30 minutes"

      - alert: HostRebooted
        expr: time() - node_boot_time_seconds{job="node"} < 600
        labels: { severity: info }
        annotations:
          summary: "The host rebooted less than 10 minutes ago: check that everything came back (Stalwart after Keycloak)"
