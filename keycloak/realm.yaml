# Realm "example": the single source of truth for Keycloak's
# configuration (instance/docs/PLAN-keycloak.md). Applied by bin/sgnl-keycloak-apply
# with keycloak-config-cli, which is idempotent: running it again only
# changes what differs. {{VARS}} are filled from .kamal/secrets.
#
# Not in here: people (bin/sgnl-kcimport / set-up email), passwords,
# passkeys. In here: everything else, incl. the agent's service account.
# With IMPORT_MANAGED_*=full, clients/groups/flows missing from this file
# are DELETED on apply: change Keycloak through this file only.
realm: {{SGNL_REALM}}
enabled: true
displayName: "Secrétariat Général"
displayNameHtml: "Secrétariat Général"

# Login: username or email; nobody signs themselves up; forgotten
# passwords via email.
registrationAllowed: false
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
resetPasswordAllowed: true
rememberMe: false
verifyEmail: false
editUsernameAllowed: false

# 3 failures within 2 min -> 30 min lockout (as Authelia had).
bruteForceProtected: true
permanentLockout: false
failureFactor: 3
maxDeltaTimeSeconds: 120
waitIncrementSeconds: 1800
maxFailureWaitSeconds: 1800
minimumQuickLoginWaitSeconds: 60
quickLoginCheckMilliSeconds: 1000

# Sessions: a working day idle, a week at most.
ssoSessionIdleTimeout: 28800
ssoSessionMaxLifespan: 604800

passwordPolicy: "length(12) and notUsername and notEmail"

smtpServer:
  host: "{{SGNL_SMTP_HOST}}"
  # 587 + STARTTLS: Hetzner Cloud blocks outgoing 465 (and 25).
  port: "587"
  starttls: "true"
  ssl: "false"
  auth: "true"
  user: "{{AWS_SES_SMTP_USERNAME}}"
  password: "{{AWS_SES_SMTP_PASSWORD}}"
  from: "auth@{{SGNL_DOMAIN}}"
  fromDisplayName: "Secrétariat Général"

# Login and admin events kept 90 days (who logged in where, who changed what).
eventsEnabled: true
eventsExpiration: 7776000
adminEventsEnabled: true
adminEventsDetailsEnabled: true
eventsListeners:
  - jboss-logging

# Second factor: a passkey or security key (WebAuthn), after the password.
# REQUIRED, so someone without one is made to register one at login
# ("passkey or TOTP" as alternatives can't do that: Keycloak then just
# fails the login, seen 2026-10-18). No TOTP.
webAuthnPolicyRpEntityName: "Secrétariat Général"
webAuthnPolicyUserVerificationRequirement: "preferred"
webAuthnPolicyPasswordlessRequireResidentKey: "not specified"
# Off: our passkeys are second-factor ones; offered on the username screen
# they fail. keycloak-config-cli resets this, bin/sgnl-keycloak-apply sets
# it again afterwards.
webAuthnPolicyPasswordlessPasskeysEnabled: false

# Login for Keycloak's own pages (account console): password + second
# factor, no group needed (so an invited person can set themselves up).
# Apps use sgnl-apps (also needs group sgnl_users) or sgnl-forgejo
# (also forgejo_users) via authenticationFlowBindingOverrides.
browserFlow: sgnl-login

# Groups carry realm roles: the access checks in the login flows test
# roles, and a role comes with group membership.
roles:
  realm:
    - name: sgnl_user
      description: "May use SGNL apps (group sgnl_users)"
    - name: forgejo_user
      description: "May use Forgejo (group forgejo_users)"
groups:
  - name: sgnl_users
    realmRoles: [sgnl_user]
  - name: admins
  - name: developers
  - name: forgejo_users
    realmRoles: [forgejo_user]
  - name: sgnl_invited

# "groups" claim with plain group names (no leading /), as Authelia had;
# in ID token, access token and userinfo (Forgejo and Dashy read the ID token).
clientScopes:
  - name: groups
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          claim.name: groups
          full.path: "false"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          introspection.token.claim: "true"

authenticationFlows:
  - alias: sgnl-login
    description: "Password + second factor (Keycloak's own pages)"
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - flowAlias: sgnl-login-login
        requirement: REQUIRED
        autheticatorFlow: true
  - alias: sgnl-login-login
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-cookie
        requirement: ALTERNATIVE
      - flowAlias: sgnl-login-forms
        requirement: ALTERNATIVE
        autheticatorFlow: true
  - alias: sgnl-login-forms
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-username-password-form
        requirement: REQUIRED
      - flowAlias: sgnl-login-second-factor
        requirement: REQUIRED
        autheticatorFlow: true
  - alias: sgnl-login-second-factor
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: webauthn-authenticator
        requirement: REQUIRED
  - alias: sgnl-apps
    description: "Password + second factor, then deny unless sgnl_user"
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - flowAlias: sgnl-apps-login
        requirement: REQUIRED
        autheticatorFlow: true
      - flowAlias: sgnl-apps-require-sgnl_user
        requirement: CONDITIONAL
        autheticatorFlow: true
  - alias: sgnl-apps-login
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-cookie
        requirement: ALTERNATIVE
      - flowAlias: sgnl-apps-forms
        requirement: ALTERNATIVE
        autheticatorFlow: true
  - alias: sgnl-apps-forms
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-username-password-form
        requirement: REQUIRED
      - flowAlias: sgnl-apps-second-factor
        requirement: REQUIRED
        autheticatorFlow: true
  - alias: sgnl-apps-second-factor
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: webauthn-authenticator
        requirement: REQUIRED
  - alias: sgnl-apps-require-sgnl_user
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-role
        requirement: REQUIRED
        authenticatorConfig: sgnl-apps-not-sgnl_user
      - authenticator: deny-access-authenticator
        requirement: REQUIRED
  - alias: sgnl-forgejo
    description: "As sgnl-apps, and also deny unless forgejo_user"
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - flowAlias: sgnl-forgejo-login
        requirement: REQUIRED
        autheticatorFlow: true
      - flowAlias: sgnl-forgejo-require-sgnl_user
        requirement: CONDITIONAL
        autheticatorFlow: true
      - flowAlias: sgnl-forgejo-require-forgejo_user
        requirement: CONDITIONAL
        autheticatorFlow: true
  - alias: sgnl-forgejo-login
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-cookie
        requirement: ALTERNATIVE
      - flowAlias: sgnl-forgejo-forms
        requirement: ALTERNATIVE
        autheticatorFlow: true
  - alias: sgnl-forgejo-forms
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-username-password-form
        requirement: REQUIRED
      - flowAlias: sgnl-forgejo-second-factor
        requirement: REQUIRED
        autheticatorFlow: true
  - alias: sgnl-forgejo-second-factor
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: webauthn-authenticator
        requirement: REQUIRED
  - alias: sgnl-forgejo-require-sgnl_user
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-role
        requirement: REQUIRED
        authenticatorConfig: sgnl-forgejo-not-sgnl_user
      - authenticator: deny-access-authenticator
        requirement: REQUIRED
  - alias: sgnl-forgejo-require-forgejo_user
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-role
        requirement: REQUIRED
        authenticatorConfig: sgnl-forgejo-not-forgejo_user
      - authenticator: deny-access-authenticator
        requirement: REQUIRED

authenticatorConfig:
  - alias: sgnl-apps-not-sgnl_user
    config:
      condUserRole: sgnl_user
      negate: "true"
  - alias: sgnl-forgejo-not-sgnl_user
    config:
      condUserRole: sgnl_user
      negate: "true"
  - alias: sgnl-forgejo-not-forgejo_user
    config:
      condUserRole: forgejo_user
      negate: "true"

# Clients: same ids and redirect URIs as Authelia had (until 2026-10-19), so
# switching an app changed its issuer URL (and secret) only. No consent
# screens (our own apps), PKCE S256 everywhere.
clients:
  - clientId: vaultwarden
    name: "Vaultwarden (vault.{{SGNL_APPS_DOMAIN}})"
    enabled: true
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "{{KEYCLOAK_VAULTWARDEN_CLIENT_SECRET}}"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: true
    redirectUris:
      - "https://vault.{{SGNL_APPS_DOMAIN}}/identity/connect/oidc-signin"
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "+"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email]
    optionalClientScopes: []
    authenticationFlowBindingOverrides:
      browser: sgnl-apps
  # Webmail: one callback per UI locale (list probed against Bulwark 1.12.0).
  - clientId: bulwark
    name: "Webmail (inbox.{{SGNL_APPS_DOMAIN}})"
    enabled: true
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "{{KEYCLOAK_BULWARK_CLIENT_SECRET}}"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: true
    redirectUris:
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/en/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/fr/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/de/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/es/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/it/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/pt/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/nl/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/pl/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/ru/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/uk/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/cs/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/sk/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/tr/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/ar/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/he/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/mn/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/ja/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/ko/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/zh/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/zh-TW/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/da/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/nb/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/hu/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/ro/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/lv/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/fa/auth/callback"
      - "https://inbox.{{SGNL_APPS_DOMAIN}}/ca/auth/callback"
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "+"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email]
    optionalClientScopes: [offline_access]
    authenticationFlowBindingOverrides:
      browser: sgnl-apps
  - clientId: stalwart-webui
    name: "Mail account (mail.{{SGNL_APPS_DOMAIN}})"
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: true
    redirectUris:
      - "https://mail.{{SGNL_APPS_DOMAIN}}/account/oauth/callback"
      - "https://mail.{{SGNL_APPS_DOMAIN}}/admin/oauth/callback"
    webOrigins: ["https://mail.{{SGNL_APPS_DOMAIN}}"]
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "+"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email]
    optionalClientScopes: [offline_access]
    authenticationFlowBindingOverrides:
      browser: sgnl-apps
  - clientId: forgejo
    name: "Git (git.{{SGNL_APPS_DOMAIN}})"
    enabled: true
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "{{KEYCLOAK_FORGEJO_CLIENT_SECRET}}"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: true
    # "authelia" = Forgejo's login source name, kept on purpose
    # (bin/sgnl-forgejo-setup); it now points at Keycloak.
    redirectUris:
      - "https://git.{{SGNL_APPS_DOMAIN}}/user/oauth2/authelia/callback"
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "+"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email, groups]
    optionalClientScopes: []
    authenticationFlowBindingOverrides:
      browser: sgnl-forgejo
  - clientId: opencloud
    name: "Files (drive.{{SGNL_APPS_DOMAIN}})"
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: true
    redirectUris:
      - "https://drive.{{SGNL_APPS_DOMAIN}}/"
      - "https://drive.{{SGNL_APPS_DOMAIN}}/oidc-callback.html"
      - "https://drive.{{SGNL_APPS_DOMAIN}}/oidc-silent-redirect.html"
    webOrigins: ["https://drive.{{SGNL_APPS_DOMAIN}}"]
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "+"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email, groups]
    optionalClientScopes: []
    authenticationFlowBindingOverrides:
      browser: sgnl-apps
  # Desktop app: loopback redirect on a random port (Keycloak ignores the port for 127.0.0.1/localhost).
  - clientId: opencloud-desktop
    name: "Files desktop app"
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: true
    redirectUris:
      - "http://127.0.0.1/*"
      - "http://localhost/*"
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "+"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email, groups]
    optionalClientScopes: [offline_access]
    authenticationFlowBindingOverrides:
      browser: sgnl-apps
  - clientId: opencloud-ios
    name: "Files iOS app"
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: true
    redirectUris:
      - "oc://ios.opencloud.eu"
      - "oc.ios://ios.opencloud.eu"
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "+"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email, groups]
    optionalClientScopes: [offline_access]
    authenticationFlowBindingOverrides:
      browser: sgnl-apps
  - clientId: opencloud-android
    name: "Files Android app"
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: true
    redirectUris:
      - "oc://android.opencloud.eu"
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "+"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email, groups]
    optionalClientScopes: [offline_access]
    authenticationFlowBindingOverrides:
      browser: sgnl-apps
  - clientId: dashy
    name: "Home (home.{{SGNL_APPS_DOMAIN}})"
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: true
    redirectUris:
      - "https://home.{{SGNL_APPS_DOMAIN}}"
      - "https://home.{{SGNL_APPS_DOMAIN}}/"
    webOrigins: ["https://home.{{SGNL_APPS_DOMAIN}}"]
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "+"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email, groups]
    optionalClientScopes: []
    authenticationFlowBindingOverrides:
      browser: sgnl-apps
  # Monitoring (config/deploy.monitoring.yml). Grafana maps the groups
  # claim to its roles at every login: admins -> Admin, else Viewer.
  - clientId: grafana
    name: "Monitoring (monitor.{{SGNL_APPS_DOMAIN}})"
    enabled: true
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "{{KEYCLOAK_GRAFANA_CLIENT_SECRET}}"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: true
    redirectUris:
      - "https://monitor.{{SGNL_APPS_DOMAIN}}/login/generic_oauth"
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "https://monitor.{{SGNL_APPS_DOMAIN}}/login"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email, groups]
    optionalClientScopes: []
    authenticationFlowBindingOverrides:
      browser: sgnl-apps

  # listmonk (campaigns): users are matched by email to existing
  # listmonk accounts (no auto-create, bin/sgnl-listmonk-setup).
  - clientId: listmonk
    name: "Campaigns (listmonk.{{SGNL_APPS_DOMAIN}})"
    enabled: true
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "{{KEYCLOAK_LISTMONK_CLIENT_SECRET}}"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: true
    redirectUris:
      - "https://listmonk.{{SGNL_APPS_DOMAIN}}/auth/oidc"
    webOrigins: []
    attributes:
      # PKCE required again since listmonk 7 (6.x sent none).
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "https://listmonk.{{SGNL_APPS_DOMAIN}}/admin/login"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email, groups]
    optionalClientScopes: []
    authenticationFlowBindingOverrides:
      browser: sgnl-apps

  # The agent (Claude, bin/sgnl-kc): client credentials only, no browser
  # login. Its rights are the realm-management roles on its service
  # account user below - people and groups, events; not realm settings.
  - clientId: sgnl-agent
    name: "SGNL agent (automation)"
    enabled: true
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "{{KEYCLOAK_SGNL_AGENT_CLIENT_SECRET}}"
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    defaultClientScopes: [basic, roles]

  # MCP gateway (instance/docs/PLAN-mcp.md, M0 auth spike). sgnl-mcp is
  # the gateway itself: no login of its own; it takes a person's token
  # (which carries "sgnl-mcp" in its audience) and trades it here
  # (standard token exchange) for a short-lived token it calls the apps
  # with, so the person's own token never reaches an app.
  - clientId: sgnl-mcp
    name: "SGNL MCP gateway"
    enabled: true
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "{{KEYCLOAK_SGNL_MCP_CLIENT_SECRET}}"
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    attributes:
      standard.token.exchange.enabled: "true"
    defaultClientScopes: [basic, acr, roles, profile, email, groups]
    optionalClientScopes: []

  # Claude Code connecting to the MCP gateway: a public client (PKCE), the
  # person logs in in their browser (password + passkey). Claude Code's
  # callback is http://localhost:<port>/callback; the port is pinned with
  # `claude mcp add --callback-port 47621`. Tokens carry aud "sgnl-mcp".
  # Later, other MCP clients log in without registration (CIMD).
  - clientId: sgnl-mcp-claude-code
    name: "Claude Code (MCP)"
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    redirectUris:
      - "http://localhost:47621/callback"
      - "http://127.0.0.1:47621/callback"
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
    protocolMappers:
      - name: audience-sgnl-mcp
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: sgnl-mcp
          access.token.claim: "true"
          id.token.claim: "false"
          introspection.token.claim: "true"
    defaultClientScopes: [basic, acr, roles, web-origins, profile, email, groups]
    # Claude Code always asks for offline_access when Keycloak offers it
    # (without it here, its login fails with invalid_scope).
    optionalClientScopes: [offline_access]
    authenticationFlowBindingOverrides:
      browser: sgnl-apps

  # Stripe Dashboard login over SAML (docs.stripe.com/get-started/account/sso/other).
  # Keycloak only confirms who someone is (NameID = their email); roles
  # stay in Stripe ("Stripe Dashboard" role assignment), and Stripe's own
  # team list decides who gets in. Stripe needs the email domain verified
  # (DNS TXT stripe-verification=… on the apex) and, in its SSO form:
  # issuer https://id.<apps domain>/realms/<realm>, URL …/protocol/saml,
  # and the realm's RS256 certificate (…/protocol/saml/descriptor).
  # Harmless if unused: Keycloak only answers requests Stripe sends.
  - clientId: "https://dashboard.stripe.com/saml/metadata"
    name: "Stripe (dashboard.stripe.com)"
    protocol: saml
    enabled: true
    frontchannelLogout: false
    redirectUris: ["https://dashboard.stripe.com/login/saml/consume"]
    attributes:
      saml_assertion_consumer_url_post: "https://dashboard.stripe.com/login/saml/consume"
      saml.force.post.binding: "true"
      saml.server.signature: "true"
      saml.assertion.signature: "true"
      saml.signature.algorithm: "RSA_SHA256"
      saml_signature_canonicalization_method: "http://www.w3.org/2001/10/xml-exc-c14n#"
      saml.client.signature: "false"
      saml.encrypt: "false"
      saml.authnstatement: "true"
      saml_name_id_format: "email"
      saml_force_name_id_format: "true"
    defaultClientScopes: []
    optionalClientScopes: []
    authenticationFlowBindingOverrides:
      browser: sgnl-apps

users:
  - username: service-account-sgnl-agent
    enabled: true
    serviceAccountClientId: sgnl-agent
