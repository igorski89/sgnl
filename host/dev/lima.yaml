# SGNL dev VM (bin/sgnl-dev up): Ubuntu 24.04 like prod, Apple Virtualization.
# The Mac reaches it through Lima's localhost forwards (SSH on ssh.localPort,
# 443 and every other published port), which needs no extra permissions.
base: template:ubuntu-24.04
vmType: vz
cpus: 4
memory: 8GiB
disk: 30GiB
ssh:
  localPort: @SSH_PORT@
# Isolation: no folders of the Mac inside the VM. The base template adds the
# home folder and an empty list here doesn't remove it: bin/sgnl-dev creates
# the VM with --mount-none.
mounts: []
# Forwarded ports listen on the Mac's localhost only. (Ports below 1024 still
# open on all interfaces: macOS lets a normal user bind those only that way.)
portForwards:
  - guestIP: 0.0.0.0
    guestPortRange: [1, 65535]
    hostIP: 127.0.0.1
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      # Kamal deploys as root over SSH, as on prod: authorise the Lima user's key for root.
      install -d -m 700 /root/.ssh
      cat /home/*/.ssh/authorized_keys > /root/.ssh/authorized_keys
      chmod 600 /root/.ssh/authorized_keys
      command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh
