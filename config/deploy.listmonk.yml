<% require "dotenv"; Dotenv.load(File.join(ENV.fetch("SGNL_INSTANCE_DIR") { abort "sgnl: which instance? Run Kamal through bin/sgnl-env --instance <name> (or bin/sgnl-deploy, bin/sgnl-dev kamal)" }, "sgnl.env")) %>
# listmonk (listmonk.sgnl): campaigns, mailing lists,
# double opt-in, subscriber self-service. Login via Keycloak (client
# "listmonk", id/configuration.yml); the local super admin
# (LISTMONK_ADMIN_PASSWORD) is break-glass only. Settings that live in
# listmonk's database (root URL, OIDC, SMTP/SES, bounces) are set by
# bin/sgnl-listmonk-setup.
#
# Our fork with an SQLite backend (github.com/igorski89/listmonk, branch
# sqlite; docker/listmonk/Dockerfile builds a pinned tag). The database is
# one SQLite file in sgnl_listmonk_data, backed up like Forgejo's
# (pause + copy of the volume, docs/BACKUPS.md). Until 2026-11 listmonk
# ran the vendor image on its own Postgres (accessory below, retired).
#
# Stop-first (bin/sgnl-deploy): two containers on one SQLite file would
# both run the campaign sender.
#
#   bin/sgnl-deploy listmonk
#   bin/sgnl-listmonk-setup
service: sgnl-listmonk
image: sgnl-listmonk

servers:
  web:
    hosts:
      - <%= ENV.fetch("SGNL_HOST") %>
    # Creates the schema on the first start (idempotent), applies
    # upgrades, then runs; --config '' = configuration from env only.
    cmd: sh -c "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && exec ./listmonk --config ''"
    options:
      network-alias: sgnl-listmonk
      memory: 256m

proxy:
  ssl: true
  host: listmonk.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>
  app_port: 9000
  healthcheck:
    path: /health

# First start creates the schema; kamal-proxy waits this long for /health.
deploy_timeout: 120

registry:
  server: localhost:5555

# Old versions kept on the server for kamal rollback (default 5; disk).
retain_containers: 2

builder:
  arch: amd64
  dockerfile: docker/listmonk/Dockerfile
  context: docker/listmonk

volumes:
  # The SQLite database (listmonk.db + its -wal/-shm files).
  - "sgnl_listmonk_data:/listmonk/data"
  # Uploaded media (images in campaigns), served publicly: never the DB.
  - "sgnl_listmonk_uploads:/listmonk/uploads"

env:
  clear:
    TZ: "<%= ENV.fetch("SGNL_TZ") %>"
    LISTMONK_app__address: "0.0.0.0:9000"
    LISTMONK_db__driver: "sqlite"
    LISTMONK_db__path: "/listmonk/data/listmonk.db"
    # Super admin created on the first start only (break-glass).
    LISTMONK_ADMIN_USER: "<%= ENV.fetch("SGNL_ADMIN_USER") %>"
  secret:
    - LISTMONK_ADMIN_PASSWORD

accessories:
  # RETIRED (listmonk moved to SQLite): kept, stopped, as the way back
  # until it's deleted (instance/docs/TODO.md). Not booted by any script.
  postgres:
    # Postgres 18's image keeps its data under /var/lib/postgresql/18/docker,
    # so the volume is mounted at /var/lib/postgresql.
    image: postgres:18.7-alpine
    host: <%= ENV.fetch("SGNL_HOST") %>
    options:
      network-alias: sgnl-listmonk-db
      memory: 256m
    volumes:
      - "sgnl_listmonk_db18:/var/lib/postgresql"
    files:
      - postgres/initdb-app-user.sh:/docker-entrypoint-initdb.d/90-app-user.sh
    env:
      clear:
        TZ: "<%= ENV.fetch("SGNL_TZ") %>"
        POSTGRES_USER: "dbadmin"
        POSTGRES_DB: "listmonk"
        SGNL_DB_APP_USER: "listmonk"
      secret:
        - POSTGRES_PASSWORD:LISTMONK_POSTGRES_PASSWORD
