<% require "dotenv"; Dotenv.load(File.join(ENV.fetch("SGNL_INSTANCE_DIR") { abort "sgnl: which instance? Run Kamal through bin/sgnl-env --instance <name> (or bin/sgnl-deploy, bin/sgnl-dev kamal)" }, "sgnl.env")) %>
# Collabora Online (CODE): the office editor OpenCloud embeds for live
# co-editing (office.sgnl). The browser loads the editor from here; the
# editor fetches/saves files through OpenCloud's WOPI endpoint on drive.sgnl,
# which is the only allowed WOPI host (aliasgroup1).
#
# Deviations from opencloud-compose stable-7.2, on purpose:
#   - admin console disabled (the example keeps it with admin/admin);
#   - no SYS_ADMIN / seccomp=unconfined / apparmor=unconfined at first:
#     the host is shared with cotenant and this parses untrusted documents.
#     Without them Collabora can't bind-mount its per-document jails and
#     copies them instead (slower document opening). Add only if needed.
#   - TLS terminated by kamal-proxy (ssl.enable=false, termination=true).
#
# Runs as a Kamal *accessory*: the unmodified vendor image behind
# kamal-proxy, no Dockerfile/build/registry. Changes: bin/sgnl-deploy <app>
# (= kamal accessory reboot web): a few seconds down, no health-gated swap.
# WOPI proof key: created once on the host by bin/sgnl-collabora-proof-key
# (bin/sgnl-deploy runs it first).
service: sgnl-collabora
image: collabora/code
# registry/builder: required by Kamal's config check; nothing is built or pushed.
registry:
  server: localhost:5555
builder:
  arch: amd64

accessories:
  web:
    image: collabora/code:26.04.6.1.1
    host: <%= ENV.fetch("SGNL_HOST") %>
    # Limits (2026-11-26): a malformed document must fail on its own, not eat
    # the shared host (a .docx ending in a bare table made LibreOffice spin and
    # write 380 MB in 40 s). Normal editing stays far below these.
    options:
      network-alias: sgnl-collabora
      memory: 3g
      cpus: 4
    proxy:
      ssl: true
      host: office.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>
      app_port: 9980
      healthcheck:
        path: /hosting/discovery
        timeout: 10
    volumes:
      - "/opt/sgnl/collabora/proof_key:/etc/coolwsd/proof_key:ro"
    env:
      clear:
        aliasgroup1: "https://drive.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>:443"
        extra_params: >-
          --o:ssl.enable=false
          --o:ssl.termination=true
          --o:welcome.enable=false
          --o:fetch_update_check=0
          --o:allow_update_popup=false
          --o:admin_console.enable=false
          --o:net.frame_ancestors=drive.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>
          --o:net.lok_allow.host[14]=drive.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>
          --o:home_mode.enable=false
          --o:per_document.limit_load_secs=60
          --o:per_document.limit_virt_mem_mb=2048
          --o:per_document.limit_file_size_mb=200
