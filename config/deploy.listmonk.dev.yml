# Dev destination (bin/sgnl-dev; `kamal ... -d dev`): merged over
# deploy.listmonk.yml. arm64, the dev certificate, the dev CA trusted (the
# login server over HTTPS, Mailpit's STARTTLS). Campaigns go to Mailpit
# (bin/sgnl-listmonk-setup: SGNL_SMTP_HOST; bounce webhooks off in dev).
# Own image name: dev's arm64 builds never share a tag with prod's images.
image: sgnl-listmonk-dev
builder:
  arch: arm64
# The VM's SSH via Lima's localhost forward (~/.sgnl-dev/ssh_config).
ssh:
  user: root
  port: <%= ENV.fetch("SGNL_DEV_SSH_PORT", "60022") %>
  keys_only: true
  keys: ["<%= ENV.fetch("HOME") %>/.lima/_config/user"]
proxy:
  ssl:
    certificate_pem: SGNL_TLS_CERT_PEM
    private_key_pem: SGNL_TLS_KEY_PEM
volumes:
  - "sgnl_listmonk_data:/listmonk/data"
  - "sgnl_listmonk_uploads:/listmonk/uploads"
  - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro"
env:
  clear:
    SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    # Bearer tokens from the gateway (fork: FORK.md "API bearer access
    # tokens"), dev only for now: the listmonk MCP spike.
    LISTMONK_api_jwt__enabled: "true"
    LISTMONK_api_jwt__issuer: "https://id.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>/realms/<%= ENV.fetch("SGNL_REALM") %>"
    LISTMONK_api_jwt__audiences: "listmonk"
    LISTMONK_api_jwt__clients: "sgnl-mcp"
