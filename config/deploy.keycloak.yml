<% require "dotenv"; Dotenv.load(File.join(ENV["SGNL_INSTANCE_DIR"] ||= "instance", "sgnl.env")) %>
# Keycloak: login (OIDC) and user directory for every app, at id.sgnl.
# Replaced Authelia + lldap on 2026-10-19 (instance/docs/PLAN-keycloak.md).
#
# Realm `example` comes from keycloak/realm.yaml (bin/sgnl-keycloak-apply).
# The master realm's admin is only the bootstrap/break-glass account
# (bin/sgnl-kcadm). Its console at id.sgnl/admin is public, protected by
# a 32-character password + brute-force lockout; kamal-proxy can't block
# a path. Automation uses the sgnl-agent service account instead.
#
#   kamal accessory boot postgres -c config/deploy.keycloak.yml   # once, first
#   kamal deploy -c config/deploy.keycloak.yml
service: sgnl-keycloak
image: sgnl-keycloak

servers:
  web:
    hosts:
      - <%= ENV.fetch("SGNL_HOST") %>
    options:
      network-alias: sgnl-keycloak
      # The JVM sizes its heap from the visible RAM (host: 31 GB), so a
      # limit is what bounds it. It takes ~70 % as heap; idle use was
      # 500-650 MB under a 1 GB limit (phase 0), so 1.25 GB leaves headroom.
      memory: 1280m

proxy:
  ssl: true
  host: id.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>
  app_port: 8080
  healthcheck:
    # /health/* is on the management port (9000), which kamal-proxy
    # can't reach; the master realm's discovery document is a 200 on 8080
    # once Keycloak and its database are up.
    path: /realms/master
    timeout: 10

# First start creates the schema (~30 s); Kamal's default wait is 30 s.
deploy_timeout: 120

registry:
  server: localhost:5555

builder:
  arch: amd64
  dockerfile: docker/keycloak/Dockerfile
  context: docker/keycloak

env:
  secret:
    - KC_DB_PASSWORD:KEYCLOAK_POSTGRES_PASSWORD
    # Only read on first start (creates the master realm's "admin").
    - KC_BOOTSTRAP_ADMIN_PASSWORD:KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD
  clear:
    TZ: "<%= ENV.fetch("SGNL_TZ") %>"
    KC_DB_URL: "jdbc:postgresql://sgnl-keycloak-db:5432/keycloak"
    KC_DB_USERNAME: "keycloak"
    KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
    KC_HOSTNAME: "https://id.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>"
    # kamal-proxy terminates TLS and sets X-Forwarded-*.
    KC_HTTP_ENABLED: "true"
    KC_PROXY_HEADERS: "xforwarded"
    # Single node: no cluster discovery.
    KC_CACHE: "local"

# Keycloak's database. Internal only (no published port), reached over
# the kamal network as sgnl-keycloak-db. Backed up as a pg_dump, not as
# files (instance/docs/PLAN-keycloak.md "Backup").
accessories:
  postgres:
    # Postgres 18's image keeps its data under /var/lib/postgresql/18/docker,
    # so the volume is mounted at /var/lib/postgresql. Major upgrades are a
    # dump + restore into a new volume (sgnl_keycloak_db18 came from 17 that way).
    image: postgres:18.7-alpine
    host: <%= ENV.fetch("SGNL_HOST") %>
    options:
      network-alias: sgnl-keycloak-db
      memory: 256m
    volumes:
      - "sgnl_keycloak_db18:/var/lib/postgresql"
    env:
      clear:
        TZ: "<%= ENV.fetch("SGNL_TZ") %>"
        POSTGRES_USER: "keycloak"
        POSTGRES_DB: "keycloak"
      secret:
        - POSTGRES_PASSWORD:KEYCLOAK_POSTGRES_PASSWORD
