<% require "dotenv"; Dotenv.load(File.join(ENV["SGNL_INSTANCE_DIR"] ||= "instance", "sgnl.env")) %>
# Landing page after login (home.sgnl): Dashy, tiles filtered by groups.
# Login via Keycloak (public PKCE client "dashy", id/configuration.yml).
# No state worth backing up: everything is in git.
#
# Runs as a Kamal *accessory*: the unmodified vendor image, no build, no
# registry, its config file rendered and uploaded by Kamal itself
# (dashy/conf.yml.erb: the generic tiles in dashy/conf.yml + the
# instance's dashy/extra-sections.yml). Behind kamal-proxy like the apps.
# Changes (tiles, version): bin/sgnl-deploy dashy (= kamal accessory reboot
# web -c config/deploy.dashy.yml): a few seconds down, no health-gated swap.
service: sgnl-dashy
# Required by Kamal even without app servers; the accessory below runs it.
image: lissy93/dashy
# registry/builder: required by Kamal's config check; nothing is built or pushed.
registry:
  server: localhost:5555
builder:
  arch: amd64

accessories:
  web:
    image: lissy93/dashy:4.9.19
    host: <%= ENV.fetch("SGNL_HOST") %>
    options:
      network-alias: sgnl-dashy
    proxy:
      ssl: true
      host: home.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>
      app_port: 8080
      healthcheck:
        path: /
    files:
      - dashy/conf.yml.erb:/app/user-data/conf.yml
    env:
      clear:
        TZ: "<%= ENV.fetch("SGNL_TZ") %>"
        NODE_ENV: "production"
