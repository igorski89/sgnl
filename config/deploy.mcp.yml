<% require "dotenv"; Dotenv.load(File.join(ENV["SGNL_INSTANCE_DIR"] ||= "instance", "sgnl.env")) %>
# MCP gateway (sgnl-mcp): one MCP endpoint over SGNL's apps for AI clients
# (Claude, Codex) at https://mcp.<apps>/mcp. People log in with their SGNL
# account (login server clients sgnl-mcp-claude-code etc.); the gateway trades
# that login for a short-lived token per app (mail, files) and never forwards
# it. Everyone in sgnl_users gets in (checked against the login server's
# current view on every login token). No state: nothing to back up; a deploy
# drops open MCP sessions and confirmation dialogs (clients reconnect).
#
#   bin/sgnl-deploy mcp
service: sgnl-mcp
image: sgnl-mcp
servers:
  web:
    hosts:
      - <%= ENV.fetch("SGNL_HOST") %>
    options:
      network-alias: sgnl-mcp
      memory: 256m
proxy:
  host: mcp.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>
  ssl: true
  app_port: 8765
  healthcheck:
    path: /health
  # MCP streams (POST + long-lived GET/SSE): no buffering, no early cut-off;
  # a send dialog may wait up to 10 minutes for the person.
  response_timeout: 900
  buffering:
    requests: false
    responses: false
registry:
  server: localhost:5555
retain_containers: 2
builder:
  arch: amd64
  dockerfile: docker/mcp/Dockerfile
  context: docker/mcp
env:
  secret:
    - SGNL_MCP_CLIENT_SECRET
    - SGNL_MCP_ADMIN_CLIENT_SECRET
  clear:
    SGNL_MCP_LABEL: "SGNL - <%= ENV.fetch("SGNL_DOMAIN") %>"
    SGNL_MCP_PUBLIC_URL: "https://mcp.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>/mcp"
    SGNL_MCP_ISSUER: "https://id.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>/realms/<%= ENV.fetch("SGNL_REALM") %>"
    SGNL_MCP_JMAP_URL: "https://mail.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>/jmap/session"
    SGNL_MCP_OPENCLOUD_URL: "https://drive.<%= ENV.fetch("SGNL_APPS_DOMAIN") %>"
    SGNL_MCP_TZ: <%= ENV.fetch("SGNL_TZ") %>
    SGNL_MCP_INTERNAL_DOMAINS: <%= ENV.fetch("SGNL_DOMAIN") %>
    # Everyone with an SGNL account (2026-11-25); turning someone off
    # = disabling their account.
    SGNL_MCP_ALLOW_GROUPS: sgnl_users
    SGNL_MCP_MAIL_AUDIENCE: stalwart-webui
    SGNL_MCP_FILES_AUDIENCE: opencloud
    SGNL_MCP_SESSION_IDLE: 1h
    # Days the mail server keeps Trash before deleting (Stalwart DataRetention
    # expunge timer); the mail_trash confirmation names it (from v0.1.8).
    SGNL_MCP_TRASH_DAYS: "30"
    # Admin tools at /admin/mcp (M4): read-only admin API client; only the
    # group admins (current view) gets in.
    SGNL_MCP_ADMIN_CLIENT_ID: sgnl-mcp-admin
    SGNL_MCP_ADMIN_GROUPS: admins
    # AI apps that may send mail or share after the confirmation dialog;
    # any other client can't. Codex is included (decided 2026-11-25): in its
    # no-approval mode it answers the dialog itself, which is the person's own
    # choice of setting in their client (SECURITY.md §6e, residual risk).
    # VS Code logs in by CIMD (its client id is its document's URL); it draws
    # the dialog itself and needs a click (2026-11-26). opencode (auto-accepts
    # an empty form) and pi (no dialog) are deliberately not listed.
    SGNL_MCP_CONFIRM_CLIENTS: sgnl-mcp-claude-code,sgnl-mcp-claude-ai,sgnl-mcp-codex,https://vscode.dev/oauth/client-metadata.json
    # An Accept faster than a person can read (1.5 s) is refused, except for
    # these clients: Codex's no-approval mode answers by itself, which the
    # admin accepted (2026-11-25/26). Catches a trusted app that starts
    # auto-answering after an update.
    SGNL_MCP_CONFIRM_FAST_OK: sgnl-mcp-codex
