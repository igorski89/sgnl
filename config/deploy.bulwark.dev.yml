# Dev destination (bin/sgnl-dev; `kamal ... -d dev`): merged over
# deploy.bulwark.yml. The dev certificate on kamal-proxy (placed first by
# bin/sgnl-dev bootstrap: this service has no app), the dev CA trusted
# (the webmail server calls the login server and the mail server over HTTPS).
# The VM's SSH via Lima's localhost forward (~/.sgnl-dev/ssh_config).
ssh:
  user: root
  port: <%= ENV.fetch("SGNL_DEV_SSH_PORT", "60022") %>
  keys_only: true
  keys: ["<%= ENV.fetch("HOME") %>/.lima/_config/user"]
accessories:
  web:
    proxy:
      ssl:
        certificate_pem: SGNL_TLS_CERT_PEM
        private_key_pem: SGNL_TLS_KEY_PEM
    volumes:
      - "sgnl_bulwark_data:/app/data"
      - "/opt/sgnl/dev-ca/ca.pem:/etc/ssl/certs/sgnl-dev-ca.pem:ro"
    env:
      clear:
        NODE_EXTRA_CA_CERTS: /etc/ssl/certs/sgnl-dev-ca.pem
