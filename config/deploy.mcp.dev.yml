# Dev destination (bin/sgnl-dev; `kamal ... -d dev`): merged over
# deploy.mcp.yml. arm64, the dev certificate, the dev CA trusted.
# Own image name: dev's arm64 builds never share a tag with prod's images.
image: sgnl-mcp-dev
builder:
  arch: arm64
  args:
    SGNL_MCP_IMAGE: ghcr.io/igorski89/sgnl-mcp:v0.1.34
# The VM's SSH via Lima's localhost forward (~/.sgnl-dev/ssh_config).
ssh:
  user: root
  port: <%= ENV.fetch("SGNL_DEV_SSH_PORT", "60022") %>
  keys_only: true
  keys: ["<%= ENV.fetch("HOME") %>/.lima/_config/user"]
proxy:
  ssl:
    certificate_pem: SGNL_TLS_CERT_PEM
    private_key_pem: SGNL_TLS_KEY_PEM
volumes:
  - "sgnl_mcp_audit:/data"
  - "/opt/sgnl/dev-ca/ca.pem:/etc/ssl/certs/sgnl-dev-ca.pem:ro"
env:
  clear:
    SSL_CERT_FILE: /etc/ssl/certs/sgnl-dev-ca.pem
    # Newsletter tools (listmonk, PLAN-mcp-newsletter.md): dev first. The
    # gateway exchanges the person's token for audience=listmonk; listmonk
    # accepts it as that person (api_jwt, config/deploy.listmonk.dev.yml).
    SGNL_MCP_NEWSLETTER_URL: "http://sgnl-listmonk:9000"
    SGNL_MCP_NEWSLETTER_AUDIENCE: "listmonk"
