# Vaultwarden organisation as config, applied by bin/sgnl-vault-sync.
# {{SGNL_*}} placeholders are filled from sgnl.env.
#
# One organisation for the company (create it once in the web vault with
# exactly this name, docs/DEPLOY.md §5). Personal passwords stay in each
# person's own vault; company ones go into a collection below.
organisation: "{{SGNL_ORG_NAME}}"

# Vaultwarden group: Keycloak group. Everyone in these Keycloak groups is
# a member of the organisation; disabled Keycloak users are revoked.
# Owners are never removed.
groups:
  everyone: sgnl_users
  admins: admins

# Login-server accounts that are never members, though in a group above
# (e.g. automated test accounts: they need sgnl_users for the apps but must
# not see company passwords).
# exclude: [sgnl-smoke, sgnl-smoke2]

# Collection: {group: view | view-hidden | edit | manage}
#   view         read items and passwords
#   view-hidden  use items, can't read the passwords
#   edit         change items
#   manage       change items and the collection's access
# Collections not listed here are left alone (never deleted).
collections:
  "{{SGNL_ORG_NAME}}": {everyone: view, admins: manage}
  SGNL: {admins: manage}
