# Authelia (our fork) - TEST deployment for the login matrix
# (instance/docs/PLAN-authelia-test.md): auth.{{SGNL_APPS_DOMAIN}}, test
# users only, nothing live logs in here. Keycloak stays the live login.
#
# Instance values (SGNL_* placeholders) are filled by bin/sgnl-render
# before upload (.kamal/hooks/pre-app-boot). The env "..." calls are
# Authelia's own template filter (X_AUTHELIA_CONFIG_FILTERS=template; it
# also parses comments, so no braces in comments), for the secrets that live
# inside lists; they come from the container's environment (vault, via
# .kamal/secrets), never from this file. Other secrets are AUTHELIA_*
# environment variables (config/deploy.authelia.yml).
---
theme: 'auto'

server:
  # The issuer keeps Keycloak's path (/realms/<realm>). Authelia also
  # answers on / with another issuer (see config/deploy.authelia.yml).
  address: 'tcp://:9091/realms/{{SGNL_REALM}}'

log:
  level: 'info'

totp:
  disable: true

webauthn:
  display_name: '{{SGNL_ORG_NAME}}'

authentication_backend:
  database:
    search:
      email: true
  password_change:
    disable: false
  password_reset:
    disable: false

password_policy:
  standard:
    enabled: true
    min_length: 12

# No forward-auth here: OIDC clients carry their own policy. Authelia
# wants a non-deny default when there are no rules.
access_control:
  default_policy: 'two_factor'

session:
  cookies:
    - domain: 'auth.{{SGNL_APPS_DOMAIN}}'
      authelia_url: 'https://auth.{{SGNL_APPS_DOMAIN}}/realms/{{SGNL_REALM}}'
      inactivity: '8h'
      expiration: '7d'

regulation:
  max_retries: 3
  find_time: '2m'
  ban_time: '30m'

storage:
  local:
    path: '/data/db.sqlite3'

# Test: messages (reset links, notifications) go to a file, no mail.
notifier:
  filesystem:
    filename: '/data/notifications.txt'

identity_providers:
  # SAML 2.0 IdP (our fork, sgnl.6+) for Stripe. TEST: throwaway key/cert
  # (config/deploy.authelia.yml); Stripe is not pointed here.
  saml:
    key: {{ secret "/config/saml-test.key" | mindent 8 "|" | msquote }}
    certificate_chain: {{ secret "/config/saml-test.crt" | mindent 8 "|" | msquote }}
    # Also answer on Keycloak's paths (<issuer>/protocol/saml, /descriptor),
    # so Stripe's stored settings stay valid at cutover.
    enable_keycloak_endpoints: true
    service_providers:
      - entity_id: 'https://dashboard.stripe.com/saml/metadata'
        assertion_consumer_service_urls: ['https://dashboard.stripe.com/login/saml/consume']
        name_id_format: 'email'
        authorization_policy: 'two_factor'
  oidc:
    jwks:
      - key: {{ env "SGNL_AUTHELIA_OIDC_JWK_B64" | b64dec | mindent 10 "|" | msquote }}
    # Browser apps (Dashy) call the token endpoint from their own origin;
    # Keycloak allows that per client ("web origins"). Here: the origins of
    # each client's redirect URIs.
    cors:
      endpoints: ['authorization', 'token', 'revocation', 'introspection', 'userinfo']
      allowed_origins_from_client_redirect_uris: true
    # Keycloak puts groups, email, name and username in every client's ID
    # token; apps rely on it (Grafana's role, Forgejo's admin, Dashy). Our
    # fork's default policy (sgnl.5) does the same for every client.
    default_claims_policy: 'keycloak_like'
    claims_policies:
      keycloak_like:
        id_token: ['email', 'email_verified', 'name', 'preferred_username', 'groups']
        # Only apps that verify JWT access tokens themselves read these (OpenCloud).
        access_token: ['email', 'email_verified', 'preferred_username', 'groups']
    clients:
      # The agent (replaces bin/sgnl-kc's Keycloak service account):
      # client credentials only, for the admin API.
      - client_id: 'sgnl-agent'
        client_name: 'SGNL agent (automation)'
        client_secret: '$plaintext${{ env "SGNL_AUTHELIA_AGENT_CLIENT_SECRET" }}'
        grant_types: ['client_credentials']
        response_types: []
        redirect_uris: []
        scopes: ['authelia.admin.read', 'authelia.admin.write']
        audience: ['https://auth.{{SGNL_APPS_DOMAIN}}/realms/{{SGNL_REALM}}/api/admin']
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'one_factor'
      # Login matrix: throwaway app copies on <app>-next hosts
      # (bin/sgnl-authelia-matrix). Same client ids as the live apps.
      - client_id: 'grafana'
        client_name: 'Grafana (test copy)'
        client_secret: '$plaintext${{ env "SGNL_AUTHELIA_TEST_GRAFANA_CLIENT_SECRET" }}'
        redirect_uris: ['https://monitor-next.{{SGNL_APPS_DOMAIN}}/login/generic_oauth']
        scopes: ['openid', 'email', 'profile', 'groups']
        grant_types: ['authorization_code']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'two_factor'
        # No consent screen, as on Keycloak.
        consent_mode: 'implicit'
      - client_id: 'vaultwarden'
        client_name: 'Vaultwarden (test copy)'
        client_secret: '$plaintext${{ env "SGNL_AUTHELIA_TEST_VAULTWARDEN_CLIENT_SECRET" }}'
        redirect_uris: ['https://vault-next.{{SGNL_APPS_DOMAIN}}/identity/connect/oidc-signin']
        scopes: ['openid', 'email', 'profile', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'two_factor'
        consent_mode: 'implicit'
      - client_id: 'forgejo'
        client_name: 'Forgejo (test copy)'
        client_secret: '$plaintext${{ env "SGNL_AUTHELIA_TEST_FORGEJO_CLIENT_SECRET" }}'
        redirect_uris: ['https://git-next.{{SGNL_APPS_DOMAIN}}/user/oauth2/authelia/callback']
        scopes: ['openid', 'email', 'profile', 'groups']
        grant_types: ['authorization_code']
        response_types: ['code']
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'two_factor'
        consent_mode: 'implicit'
      - client_id: 'listmonk'
        client_name: 'listmonk (test copy)'
        client_secret: '$plaintext${{ env "SGNL_AUTHELIA_TEST_LISTMONK_CLIENT_SECRET" }}'
        redirect_uris: ['https://listmonk-next.{{SGNL_APPS_DOMAIN}}/auth/oidc']
        scopes: ['openid', 'email', 'profile']
        grant_types: ['authorization_code']
        response_types: ['code']
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'two_factor'
        consent_mode: 'implicit'
      - client_id: 'dashy'
        client_name: 'Dashy (test copy)'
        public: true
        redirect_uris: ['https://home-next.{{SGNL_APPS_DOMAIN}}/', 'https://home-next.{{SGNL_APPS_DOMAIN}}']
        scopes: ['openid', 'email', 'profile', 'groups']
        grant_types: ['authorization_code']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'none'
        authorization_policy: 'two_factor'
        consent_mode: 'implicit'
      - client_id: 'opencloud'
        client_name: 'OpenCloud web (test copy)'
        public: true
        redirect_uris:
          - 'https://drive-next.{{SGNL_APPS_DOMAIN}}/'
          - 'https://drive-next.{{SGNL_APPS_DOMAIN}}/oidc-callback.html'
          - 'https://drive-next.{{SGNL_APPS_DOMAIN}}/oidc-silent-redirect.html'
        scopes: ['openid', 'email', 'profile', 'groups', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'none'
        # OpenCloud verifies access tokens itself (JWT, as with Keycloak).
        access_token_signed_response_alg: 'RS256'
        authorization_policy: 'two_factor'
        consent_mode: 'implicit'
      - client_id: 'bulwark'
        client_name: 'Webmail (test copy)'
        client_secret: '$plaintext${{ env "SGNL_AUTHELIA_TEST_BULWARK_CLIENT_SECRET" }}'
        redirect_uris: ['https://inbox-next.{{SGNL_APPS_DOMAIN}}/en/auth/callback']
        scopes: ['openid', 'email', 'profile', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        # Bulwark sends its secret in the body (Keycloak takes either).
        token_endpoint_auth_method: 'client_secret_post'
        authorization_policy: 'two_factor'
        # offline_access (stay logged in) always asks for consent in
        # Authelia; Keycloak doesn't. Pre-configured: asked once, remembered.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1y'
...
