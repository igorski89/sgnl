# gitleaks config for this repo (pre-push hook, CI): the default rules,
# minus known fakes. (gitleaks 8.24: one global [allowlist].)
[extend]
useDefault = true

[allowlist]
description = "Known fakes: Vector redaction tests (made-up keys by design); Keycloak's database URL (host and port, no password)"
paths = ['''monitoring/vector/tests\.yaml''']
regexTarget = "line"
regexes = ['''jdbc:postgresql://sgnl-keycloak-db:5432/keycloak''']
