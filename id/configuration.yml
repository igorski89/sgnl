      - client_id: 'sgnl-mcp'
        client_name: 'SGNL MCP gateway'
        client_secret: '{{ env "SGNL_ID_MCP_CLIENT_SECRET_HASH_B64" | b64dec }}'
        token_endpoint_auth_method: 'client_secret_post'
        grant_types: ['urn:ietf:params:oauth:grant-type:token-exchange']
        response_types: []
        redirect_uris: []
        scopes: ['openid', 'profile', 'email', 'groups']
        subject_token_types_supported: ['urn:ietf:params:oauth:token-type:access_token']
        request_token_types_supported: ['urn:ietf:params:oauth:token-type:access_token']
        impersonation_allowed: true
        consent_mode: 'implicit'
        # Per-app tokens (M3): the gateway asks for audience=<app client id>;
        # the exchange then also enforces that app's policy.
        audience: ['sgnl-mcp', 'opencloud', 'stalwart-webui', 'grafana']
        access_token_signed_response_alg: 'RS256'
        claims_policy: 'mcp'
        lifespan: 'mcp_exchange'
        authorization_policy: 'sgnl_apps'
