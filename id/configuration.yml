# Authelia (our fork) - PRODUCTION login server for SGNL, replacing Keycloak
# (instance/docs/PLAN-authelia-fork.md). Served ONLY under the issuer path
# https://id.{{SGNL_APPS_DOMAIN}}/realms/{{SGNL_REALM}} (config/deploy.id.yml), so the
# issuer, the passkeys' RP ID and every app's settings stay as they are.
# Deploying it IS the switch-over: follow the cutover runbook.
#
# Instance values (SGNL_* placeholders) are filled by bin/sgnl-render before
# upload. The env "..." calls are Authelia's template filter
# (X_AUTHELIA_CONFIG_FILTERS=template; it also parses comments: no braces in
# comments): secrets come from the container's environment (vault, via
# .kamal/secrets), never from this file. App client secrets are the ones the
# apps already use (keycloak-<app>-client-secret), so no app changes.
#
# Settings mirror Keycloak's realm.yaml (removed): password + passkey (second factor),
# login by username or email, sessions 8 h idle / 7 days, no remember-me,
# 3 failures in 2 min -> 30 min lockout, passwords >= 12 characters, every
# app needs group sgnl_users (Forgejo also forgejo_users), Stripe over SAML.
---
theme: 'auto'

server:
  address: 'tcp://:9091/realms/{{SGNL_REALM}}'
  # Stripe's SAML login URL (signed, with RelayState) plus the cookies on
  # this host exceed the 4 KB default (431 Request Header Fields Too Large).
  buffers:
    read: 16384
    write: 16384

log:
  level: 'info'

totp:
  disable: true

webauthn:
  display_name: '{{SGNL_ORG_NAME}}'

authentication_backend:
  database:
    search:
      email: true
  password_change:
    disable: false
  password_reset:
    disable: false

password_policy:
  standard:
    enabled: true
    min_length: 12

# No forward-auth: apps use OIDC/SAML and carry their own policy. Authelia
# needs a non-deny default to offer the second-factor settings page.
access_control:
  default_policy: 'two_factor'

session:
  cookies:
    - domain: 'id.{{SGNL_APPS_DOMAIN}}'
      authelia_url: 'https://id.{{SGNL_APPS_DOMAIN}}/realms/{{SGNL_REALM}}'
      inactivity: '8h'
      expiration: '7d'
      # No remember-me, as on Keycloak.
      remember_me: -1

regulation:
  max_retries: 3
  find_time: '2m'
  ban_time: '30m'

# Metrics for monitoring (vmagent finds the container by its metrics.port
# label, config/deploy.id.yml); only on the kamal network, no route.
telemetry:
  metrics:
    enabled: true
    address: 'tcp://:9959/metrics'

storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  smtp:
    address: 'submission://{{SGNL_SMTP_HOST}}:587'
    sender: '{{SGNL_ORG_NAME}} <auth@{{SGNL_DOMAIN}}>'

identity_providers:
  # Stripe over SAML. The key and certificate are Keycloak's realm RS256
  # pair (Stripe stores that certificate), from the vault at cutover.
  saml:
    key: {{ env "SGNL_ID_SAML_KEY_B64" | b64dec | mindent 8 "|" | msquote }}
    certificate_chain: {{ env "SGNL_ID_SAML_CERT_B64" | b64dec | mindent 8 "|" | msquote }}
    enable_keycloak_endpoints: true
    service_providers:
      - entity_id: 'https://dashboard.stripe.com/saml/metadata'
        assertion_consumer_service_urls: ['https://dashboard.stripe.com/login/saml/consume']
        name_id_format: 'email'
        authorization_policy: 'two_factor'
        groups: ['sgnl_users']
        # Stripe signs its requests but publishes no signing certificate
        # (Keycloak never checked). Don't verify them (fork sgnl.11+); this
        # also ignores ForceAuthn for Stripe (which never sends it), so a
        # forged one can't end anyone's session.
        request_signature: 'ignore'
  oidc:
    # Access tokens last 5 minutes (Keycloak's default, which we had):
    # OpenCloud accepts a signed token until it expires, so this is how
    # long a disabled person can keep using it.
    # Refresh tokens: a working day idle (each use issues a new one), as
    # Keycloak's sessions.
    lifespans:
      access_token: '5m'
      refresh_token: '8h'
      custom:
        # Apps that stay signed in (OpenCloud desktop/phone, webmail): 30
        # days without use, as Keycloak's offline sessions (2026-11-24).
        stay_signed_in:
          access_token: '5m'
          refresh_token: '30d'
        # The MCP login (Claude Code): idle 14 days, at most 30 days
        # (2026-11-24), then password + passkey again.
        # Access 1h (M3 stage 5): Claude Code refreshes whenever 5 minutes or
        # less are left (its MCP log), so 5m meant a refresh per request.
        # 1h only since OpenCloud and Stalwart refuse tokens not issued for
        # them (aud_check 6/6, 2026-11-24): a copied login token works only
        # at the gateway, which checks with the login server on every token.
        mcp_login:
          access_token: '1h'
          refresh_token: '14d'
          refresh_token_maximum: '30d'
        mcp_exchange:
          grants:
            token_exchange:
              access_token: '5m'
    # RFC 8693 token exchange (fork sgnl.12+; keys follow upstream's open
    # PR #13122, provisional): only access tokens, only for sgnl-mcp.
    token_exchange:
      token_types: ['urn:ietf:params:oauth:token-type:access_token']
      default_requested_token_type: 'urn:ietf:params:oauth:token-type:access_token'
    # Client ID Metadata Documents (fork sgnl.14+, localhost filter sgnl.15):
    # AI apps without a registered client identify themselves by the URL of
    # a document they publish. One rule per app host; each gets exactly what
    # the registered MCP clients get: the hosted gateway's /mcp only (no
    # /admin/mcp), password + passkey, explicit consent. Whether an app may
    # send or share is the gateway's SGNL_MCP_CONFIRM_CLIENTS (VS Code yes;
    # opencode auto-accepts dialogs and pi has none: read and drafts only).
    client_id_metadata_documents:
      enabled: true
      rules:
        # VS Code (GitHub Copilot): native, loopback 127.0.0.1:33418.
        - domain: 'vscode.dev'
          allow_loopback_redirect_uris: true
          authorization_policy: 'sgnl_apps'
          consent_mode: 'explicit'
          scopes: ['openid', 'profile', 'email', 'groups', 'offline_access']
          audience: ['sgnl-mcp']
          requested_audience_mode: 'implicit'
          resource: ['https://mcp.{{SGNL_APPS_DOMAIN}}/mcp']
          implicit_audience_with_resource: true
          access_token_signed_response_alg: 'RS256'
          claims_policy: 'mcp'
          lifespan: 'mcp_login'
          subject_token_clients_supported: ['sgnl-mcp']
        # opencode: native, loopback 127.0.0.1.
        - domain: 'opencode.ai'
          allow_loopback_redirect_uris: true
          authorization_policy: 'sgnl_apps'
          consent_mode: 'explicit'
          scopes: ['openid', 'profile', 'email', 'groups', 'offline_access']
          audience: ['sgnl-mcp']
          requested_audience_mode: 'implicit'
          resource: ['https://mcp.{{SGNL_APPS_DOMAIN}}/mcp']
          implicit_audience_with_resource: true
          access_token_signed_response_alg: 'RS256'
          claims_policy: 'mcp'
          lifespan: 'mcp_login'
          subject_token_clients_supported: ['sgnl-mcp']
        # pi coding agent: native, loopback 127.0.0.1.
        - domain: 'pi.dev'
          allow_loopback_redirect_uris: true
          authorization_policy: 'sgnl_apps'
          consent_mode: 'explicit'
          scopes: ['openid', 'profile', 'email', 'groups', 'offline_access']
          audience: ['sgnl-mcp']
          requested_audience_mode: 'implicit'
          resource: ['https://mcp.{{SGNL_APPS_DOMAIN}}/mcp']
          implicit_audience_with_resource: true
          access_token_signed_response_alg: 'RS256'
          claims_policy: 'mcp'
          lifespan: 'mcp_login'
          subject_token_clients_supported: ['sgnl-mcp']
    jwks:
      - key: {{ env "SGNL_ID_OIDC_JWK_B64" | b64dec | mindent 10 "|" | msquote }}
    cors:
      endpoints: ['token', 'revocation', 'introspection', 'userinfo']
      allowed_origins_from_client_redirect_uris: true
    # Keycloak puts groups, email, name and username in every token; apps
    # rely on it (Grafana's role, Forgejo's admin, OpenCloud's role).
    default_claims_policy: 'keycloak_like'
    claims_policies:
      keycloak_like:
        id_token: ['email', 'email_verified', 'name', 'preferred_username', 'groups']
        access_token: ['email', 'email_verified', 'preferred_username', 'groups']
      # MCP: the gateway checks these four claims are identical in the
      # login token and the exchanged one.
      mcp:
        id_token: ['email', 'email_verified', 'name', 'preferred_username', 'groups']
        access_token: ['email', 'email_verified', 'name', 'preferred_username', 'groups']
    authorization_policies:
      sgnl_apps:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject: 'group:sgnl_users'
      sgnl_forgejo:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject: [['group:sgnl_users', 'group:forgejo_users']]
    clients:
      # The agent (bin/sgnl-kc's successor): client credentials only, for
      # the admin API.
      - client_id: 'sgnl-agent'
        client_name: 'SGNL agent (automation)'
        client_secret: '{{ env "SGNL_ID_AGENT_CLIENT_SECRET_HASH_B64" | b64dec }}'
        grant_types: ['client_credentials']
        response_types: []
        redirect_uris: []
        scopes: ['authelia.admin.read', 'authelia.admin.write']
        audience: ['https://id.{{SGNL_APPS_DOMAIN}}/realms/{{SGNL_REALM}}/api/admin']
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'one_factor'
      # The apps (generated from Keycloak's realm.yaml (removed) + the login matrix; the
      # MCP gateway's clients come after the switch-over).
      - client_id: 'vaultwarden'
        client_name: 'Vaultwarden (vault.{{SGNL_APPS_DOMAIN}})'
        client_secret: '{{ env "SGNL_ID_VAULTWARDEN_CLIENT_SECRET_HASH_B64" | b64dec }}'
        redirect_uris:
          - 'https://vault.{{SGNL_APPS_DOMAIN}}/identity/connect/oidc-signin'
        scopes: ['openid', 'email', 'profile']
        grant_types: ['authorization_code']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'sgnl_apps'
        consent_mode: 'implicit'
      # Bulwark sends its secret in the body; stays logged in (offline_access) without a consent screen (fork option).
      - client_id: 'bulwark'
        client_name: 'Webmail (inbox.{{SGNL_APPS_DOMAIN}})'
        client_secret: '{{ env "SGNL_ID_BULWARK_CLIENT_SECRET_HASH_B64" | b64dec }}'
        redirect_uris:
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/en/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/fr/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/de/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/es/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/it/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/pt/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/nl/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/pl/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/ru/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/uk/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/cs/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/sk/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/tr/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/ar/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/he/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/mn/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/ja/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/ko/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/zh/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/zh-TW/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/da/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/nb/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/hu/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/ro/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/lv/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/fa/auth/callback'
          - 'https://inbox.{{SGNL_APPS_DOMAIN}}/ca/auth/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'client_secret_post'
        lifespan: 'stay_signed_in'
        authorization_policy: 'sgnl_apps'
        consent_mode: 'implicit'
        consent_implicit_offline_access: true
      # Sends RFC 8707 resource=<its own URL>; asks for a fresh login (password confirmation at consent).
      - client_id: 'stalwart-webui'
        client_name: 'Mail account (mail.{{SGNL_APPS_DOMAIN}})'
        public: true
        redirect_uris:
          - 'https://mail.{{SGNL_APPS_DOMAIN}}/account/oauth/callback'
          - 'https://mail.{{SGNL_APPS_DOMAIN}}/admin/oauth/callback'
        resource: ['https://mail.{{SGNL_APPS_DOMAIN}}']
        scopes: ['openid', 'email', 'profile', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'none'
        authorization_policy: 'sgnl_apps'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1y'
      - client_id: 'forgejo'
        client_name: 'Git (git.{{SGNL_APPS_DOMAIN}})'
        client_secret: '{{ env "SGNL_ID_FORGEJO_CLIENT_SECRET_HASH_B64" | b64dec }}'
        redirect_uris:
          - 'https://git.{{SGNL_APPS_DOMAIN}}/user/oauth2/authelia/callback'
        scopes: ['openid', 'email', 'profile', 'groups']
        grant_types: ['authorization_code']
        response_types: ['code']
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'sgnl_forgejo'
        consent_mode: 'implicit'
      - client_id: 'opencloud'
        client_name: 'Files (drive.{{SGNL_APPS_DOMAIN}})'
        public: true
        redirect_uris:
          - 'https://drive.{{SGNL_APPS_DOMAIN}}/'
          - 'https://drive.{{SGNL_APPS_DOMAIN}}/oidc-callback.html'
          - 'https://drive.{{SGNL_APPS_DOMAIN}}/oidc-silent-redirect.html'
        scopes: ['openid', 'email', 'profile', 'groups']
        grant_types: ['authorization_code']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'none'
        # Tokens carry aud opencloud; OpenCloud enforces it
        # (PROXY_OIDC_AUDIENCES, M3), so other tokens are refused there.
        audience: ['opencloud']
        requested_audience_mode: 'implicit'
        access_token_signed_response_alg: 'RS256'
        authorization_policy: 'sgnl_apps'
        consent_mode: 'implicit'
      # The app sends http://127.0.0.1:<port> (any port allowed for this form only).
      - client_id: 'opencloud-desktop'
        client_name: 'Files desktop app'
        public: true
        redirect_uris:
          - 'http://127.0.0.1'
        scopes: ['openid', 'email', 'profile', 'groups', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'none'
        audience: ['opencloud']
        requested_audience_mode: 'implicit'
        access_token_signed_response_alg: 'RS256'
        lifespan: 'stay_signed_in'
        authorization_policy: 'sgnl_apps'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1y'
      - client_id: 'opencloud-ios'
        client_name: 'Files iOS app'
        public: true
        redirect_uris:
          - 'oc://ios.opencloud.eu'
          - 'oc.ios://ios.opencloud.eu'
        scopes: ['openid', 'email', 'profile', 'groups', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'none'
        audience: ['opencloud']
        requested_audience_mode: 'implicit'
        access_token_signed_response_alg: 'RS256'
        lifespan: 'stay_signed_in'
        authorization_policy: 'sgnl_apps'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1y'
      - client_id: 'opencloud-android'
        client_name: 'Files Android app'
        public: true
        redirect_uris:
          - 'oc://android.opencloud.eu'
        scopes: ['openid', 'email', 'profile', 'groups', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'none'
        audience: ['opencloud']
        requested_audience_mode: 'implicit'
        access_token_signed_response_alg: 'RS256'
        lifespan: 'stay_signed_in'
        authorization_policy: 'sgnl_apps'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1y'
      - client_id: 'dashy'
        client_name: 'Home (home.{{SGNL_APPS_DOMAIN}})'
        public: true
        redirect_uris:
          - 'https://home.{{SGNL_APPS_DOMAIN}}'
          - 'https://home.{{SGNL_APPS_DOMAIN}}/'
        scopes: ['openid', 'email', 'profile', 'groups']
        grant_types: ['authorization_code']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'none'
        authorization_policy: 'sgnl_apps'
        consent_mode: 'implicit'
      - client_id: 'grafana'
        client_name: 'Monitoring (monitor.{{SGNL_APPS_DOMAIN}})'
        client_secret: '{{ env "SGNL_ID_GRAFANA_CLIENT_SECRET_HASH_B64" | b64dec }}'
        redirect_uris:
          - 'https://monitor.{{SGNL_APPS_DOMAIN}}/login/generic_oauth'
        scopes: ['openid', 'email', 'profile', 'groups']
        grant_types: ['authorization_code']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'sgnl_apps'
        consent_mode: 'implicit'
      - client_id: 'listmonk'
        client_name: 'Campaigns (listmonk.{{SGNL_APPS_DOMAIN}})'
        client_secret: '{{ env "SGNL_ID_LISTMONK_CLIENT_SECRET_HASH_B64" | b64dec }}'
        redirect_uris:
          - 'https://listmonk.{{SGNL_APPS_DOMAIN}}/auth/oidc'
        scopes: ['openid', 'email', 'profile', 'groups']
        grant_types: ['authorization_code']
        response_types: ['code']
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'sgnl_apps'
        consent_mode: 'implicit'
      # The MCP gateway's admin tools (M4, /admin/mcp): client credentials
      # for the admin API, READ ONLY until the change tools exist and are
      # reviewed. The gateway checks the person's current groups (admins).
      - client_id: 'sgnl-mcp-admin'
        client_name: 'SGNL MCP gateway (admin tools, read-only)'
        client_secret: '{{ env "SGNL_ID_MCP_ADMIN_CLIENT_SECRET_HASH_B64" | b64dec }}'
        grant_types: ['client_credentials']
        response_types: []
        redirect_uris: []
        scopes: ['authelia.admin.read']
        audience: ['https://id.{{SGNL_APPS_DOMAIN}}/realms/{{SGNL_REALM}}/api/admin']
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'one_factor'
      # The gateway's admin client for CHANGES (2026-11-26): invite, groups,
      # logout, disable/enable, each confirmed by an admin in the AI app.
      # Separate from the read-only client so write can be switched off
      # alone (unset the gateway's SGNL_MCP_ADMIN_WRITE_* env).
      - client_id: 'sgnl-mcp-admin-write'
        client_name: 'SGNL MCP gateway (admin tools, changes)'
        client_secret: '{{ env "SGNL_ID_MCP_ADMIN_WRITE_CLIENT_SECRET_HASH_B64" | b64dec }}'
        grant_types: ['client_credentials']
        response_types: []
        redirect_uris: []
        scopes: ['authelia.admin.read', 'authelia.admin.write']
        audience: ['https://id.{{SGNL_APPS_DOMAIN}}/realms/{{SGNL_REALM}}/api/admin']
        token_endpoint_auth_method: 'client_secret_basic'
        authorization_policy: 'one_factor'
      # MCP gateway (instance/docs/PLAN-mcp.md). Claude Code logs in here
      # (PKCE, loopback); its token is for the gateway (aud sgnl-mcp) only.
      - client_id: 'sgnl-mcp-claude-code'
        client_name: 'Claude Code (SGNL MCP)'
        public: true
        token_endpoint_auth_method: 'none'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'http://127.0.0.1:47621/callback'
          - 'http://localhost:47621/callback'
        scopes: ['openid', 'profile', 'email', 'groups', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        audience: ['sgnl-mcp']
        requested_audience_mode: 'implicit'
        # Claude Code names the gateway's URL as the resource (RFC 8707, as
        # the MCP spec asks): the hosted gateway (M3) and the local one (dev).
        resource: ['https://mcp.{{SGNL_APPS_DOMAIN}}/mcp', 'https://mcp.{{SGNL_APPS_DOMAIN}}/admin/mcp',
                   'http://localhost:8765/mcp', 'http://localhost:8765/admin/mcp']
        # ...and keep sgnl-mcp in aud too (fork sgnl.13+), so the gateway can
        # exchange the token.
        implicit_audience_with_resource: true
        access_token_signed_response_alg: 'RS256'
        claims_policy: 'mcp'
        lifespan: 'mcp_login'
        authorization_policy: 'sgnl_apps'
        # Only the gateway may exchange this client's tokens.
        subject_token_clients_supported: ['sgnl-mcp']
      # claude.ai custom connector ("use your own OAuth client"; also Claude
      # Desktop and the phone apps). Tokens live on Anthropic's servers.
      - client_id: 'sgnl-mcp-claude-ai'
        client_name: 'Claude (claude.ai, Desktop, phone)'
        public: true
        token_endpoint_auth_method: 'none'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://claude.ai/api/mcp/auth_callback'
        scopes: ['openid', 'profile', 'email', 'groups', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        audience: ['sgnl-mcp']
        requested_audience_mode: 'implicit'
        resource: ['https://mcp.{{SGNL_APPS_DOMAIN}}/mcp', 'https://mcp.{{SGNL_APPS_DOMAIN}}/admin/mcp']
        # ...and keep sgnl-mcp in aud too (fork sgnl.13+), so the gateway can
        # exchange the token.
        implicit_audience_with_resource: true
        access_token_signed_response_alg: 'RS256'
        claims_policy: 'mcp'
        lifespan: 'mcp_login'
        authorization_policy: 'sgnl_apps'
        # Only the gateway may exchange this client's tokens.
        subject_token_clients_supported: ['sgnl-mcp']
      # Codex CLI: fixed client, loopback callback on port 47622.
      - client_id: 'sgnl-mcp-codex'
        client_name: 'Codex (SGNL MCP)'
        public: true
        token_endpoint_auth_method: 'none'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
